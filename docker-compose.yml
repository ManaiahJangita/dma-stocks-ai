services:
  postgres:
    image: postgres:16
    container_name: stock-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: stock_ai
    ports:
      - "5432:5432"
    volumes:
      - stock_ai_pgdata:/var/lib/postgresql/data

volumes:
  stock_ai_pgdata:
