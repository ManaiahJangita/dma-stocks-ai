# ============================================================
# APPLICATION
# ============================================================
spring.application.name=ai-stock-analyzer
server.port=8082

# ============================================================
# POSTGRESQL DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/dmastockai
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HIKARI CONNECTION POOL
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.flyway.enabled=false

# Synchronize prediction rows into stock_analyzer after startup, then every 15 minutes.
stock-analyzer.sync.initial-delay-ms=60000
stock-analyzer.sync.fixed-delay-ms=900000
payment.plan-sync.initial-delay-ms=60000
payment.plan-sync.fixed-delay-ms=900000
market-history.sync.initial-delay-ms=60000
market-history.sync.fixed-delay-ms=86400000

# Dashboard: cron for the dashboard table refresh and rows kept per filter option.
dashboard.sync.cron=0 0 18 ? * MON-FRI
dashboard.top-limit=20
# Stocks and indexes come from the instruments table for this exchange (BSE can be added later).
dashboard.exchange=NSE
# Instruments carry no sector data. Optional: dashboard.sector.banking=HDFCBANK,SBIN (sector rows are skipped when unset).

# ============================================================
# SPRING AI / OPENAI
# ============================================================
# TODO: PROVIDE ONLY IF YOU WANT TO USE AI EXPLANATIONS
spring.ai.openai.api-key=YOUR_OPENAI_API_KEY

# ============================================================
# LOGGING
# ============================================================
logging.level.com.ford.stockai=INFO

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt.expiration-time-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.secret-key=dmastocksalert
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

